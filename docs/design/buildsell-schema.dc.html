document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

odel<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;letter-spacing:-.025em\">Component breakdown<\u002Fh1>\n      <p style=\"margin:12px 0 0;color:#5b6b72;font-size:16.5px;max-width:46em;line-height:1.6\">How the spec-site template decomposes into Sanity schemas. <b>3 documents<\u002Fb>, a <b>page-builder array<\u002Fb> of <b>7 section blocks<\u002Fb>, and <b>11 reusable objects<\u002Fb>. One content model drives all three layouts (A/B/C) — only <code style=\"background:#fff;padding:1px 6px;border-radius:5px;font-size:14px\">theme.layoutVariant<\u002Fcode> and the color tokens change.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- LEGEND -->\n    <div style=\"background:#fff;border-radius:16px;padding:18px 22px;box-shadow:0 1px 2px rgba(8,40,55,.06);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#90a0a6;margin-right:4px\">Field types<\u002Fspan>\n      <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"13\"><span style=\"{{ l.chip }}\">{{ l.t }}<\u002Fspan><\u002Fsc-for>\n      <span style=\"margin-left:auto;font-size:12px;color:#dc2626;font-weight:800;letter-spacing:.05em\">REQ = required<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- ARCHITECTURE -->\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\"><div style=\"width:7px;height:7px;border-radius:999px;background:#0d9488\"><\u002Fdiv><h2 style=\"margin:0;font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b72\">Architecture<\u002Fh2><\u002Fdiv>\n      <div style=\"background:#fff;border-radius:20px;padding:30px;box-shadow:0 1px 3px rgba(8,40,55,.08);display:flex;flex-direction:column;gap:8px\">\n        <!-- documents row -->\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#90a0a6\">Documents — editable in Studio<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px\">\n          <div style=\"border:1.5px solid #cdebe7;background:#f0fbfa;border-radius:14px;padding:16px\"><div style=\"display:flex;align-items:center;gap:9px\"><i data-lucide=\"settings\" style=\"width:18px;height:18px;color:#0d9488\"><\u002Fi><code style=\"font-weight:700;font-size:14.5px\">siteSettings<\u002Fcode><\u002Fdiv><div style=\"font-size:12.5px;color:#5b6b72;margin-top:6px\">Singleton · brand profile + theme tokens<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #cdebe7;background:#f0fbfa;border-radius:14px;padding:16px\"><div style=\"display:flex;align-items:center;gap:9px\"><i data-lucide=\"file-text\" style=\"width:18px;height:18px;color:#0d9488\"><\u002Fi><code style=\"font-weight:700;font-size:14.5px\">page<\u002Fcode><\u002Fdiv><div style=\"font-size:12.5px;color:#5b6b72;margin-top:6px\">The landing page · sections[] builder<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1.5px solid #cdebe7;background:#f0fbfa;border-radius:14px;padding:16px\"><div style=\"display:flex;align-items:center;gap:9px\"><i data-lucide=\"message-square-quote\" style=\"width:18px;height:18px;color:#0d9488\"><\u002Fi><code style=\"font-weight:700;font-size:14.5px\">review<\u002Fcode><\u002Fdiv><div style=\"font-size:12.5px;color:#5b6b72;margin-top:6px\">Reusable testimonials · filter &amp; feature<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;margin:6px 0\"><i data-lucide=\"arrow-down\" style=\"width:22px;height:22px;color:#b3c0c4\"><\u002Fi><\u002Fdiv>\n        <!-- blocks row -->\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#90a0a6\">Page builder — <code style=\"font-size:12px\">page.sections[]<\u002Fcode><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:6px\">\n          <sc-for list=\"{{ archBlocks }}\" as=\"b\" hint-placeholder-count=\"7\"><div style=\"border:1px solid #e3e8ea;border-radius:11px;padding:10px 14px;display:flex;align-items:center;gap:8px;background:#fafcfc\"><i data-lucide=\"{{ b.icon }}\" style=\"width:16px;height:16px;color:#0d9488\"><\u002Fi><code style=\"font-size:13px;font-weight:600\">{{ b.n }}<\u002Fcode><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;margin:6px 0\"><i data-lucide=\"arrow-down\" style=\"width:22px;height:22px;color:#b3c0c4\"><\u002Fi><\u002Fdiv>\n        <!-- objects row -->\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#90a0a6\">Reusable objects — composed inside blocks<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:6px\">\n          <sc-for list=\"{{ archObjects }}\" as=\"o\" hint-placeholder-count=\"11\"><code style=\"font-size:12.5px;font-weight:600;background:#f1f5f9;color:#475569;padding:6px 11px;border-radius:8px\">{{ o }}<\u002Fcode><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DOCUMENTS -->\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\"><div style=\"width:7px;height:7px;border-radius:999px;background:#0d9488\"><\u002Fdiv><h2 style=\"margin:0;font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b72\">Documents<\u002Fh2><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <sc-for list=\"{{ documents }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(8,40,55,.08);overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:13px;padding:22px 26px;border-bottom:1px solid #eef1f3\">\n              <div style=\"width:42px;height:42px;border-radius:12px;background:#0f1f24;display:flex;align-items:center;justify-content:center\"><i data-lucide=\"{{ d.icon }}\" style=\"width:21px;height:21px;color:#fff\"><\u002Fi><\u002Fdiv>\n              <div><code style=\"font-family:'Space Grotesk';font-weight:700;font-size:19px\">{{ d.name }}<\u002Fcode><div style=\"font-size:13px;color:#5b6b72;margin-top:2px\">{{ d.kind }} · {{ d.desc }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:8px 26px 18px\">\n              <sc-for list=\"{{ d.fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid;grid-template-columns:190px 116px 1fr;gap:14px;align-items:start;padding:10px 0;border-bottom:1px solid #f2f5f6\">\n                  <code style=\"font-size:13.5px;font-weight:600;color:#0f1f24;word-break:break-word\">{{ f.f }}<span style=\"{{ f.reqStyle }}\">{{ f.reqMark }}<\u002Fspan><\u002Fcode>\n                  <div><span style=\"{{ f.chip }}\">{{ f.t }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:13px;color:#5b6b72;line-height:1.5\">{{ f.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SECTION BLOCKS -->\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\"><div style=\"width:7px;height:7px;border-radius:999px;background:#0d9488\"><\u002Fdiv><h2 style=\"margin:0;font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b72\">Section blocks<\u002Fh2><span style=\"font-size:13px;color:#90a0a6\">the <code style=\"font-size:12.5px\">page.sections[]<\u002Fcode> page-builder array<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0 0 20px;font-size:13.5px;color:#7a8a90;max-width:52em\">Each block is an <code style=\"background:#fff;padding:1px 6px;border-radius:5px\">object<\u002Fcode> type registered in the sections array. The frontend renders the same data differently per <code style=\"background:#fff;padding:1px 6px;border-radius:5px\">layoutVariant<\u002Fcode> — no content re-authoring to switch A/B/C.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <sc-for list=\"{{ blocks }}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(8,40,55,.08);overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:13px;padding:20px 26px;border-bottom:1px solid #eef1f3\">\n              <div style=\"width:40px;height:40px;border-radius:11px;background:#ccfbf1;display:flex;align-items:center;justify-content:center\"><i data-lucide=\"{{ d.icon }}\" style=\"width:20px;height:20px;color:#0f766e\"><\u002Fi><\u002Fdiv>\n              <div style=\"flex:1\"><code style=\"font-family:'Space Grotesk';font-weight:700;font-size:17.5px\">{{ d.name }}<\u002Fcode><div style=\"font-size:13px;color:#5b6b72;margin-top:2px\">{{ d.desc }}<\u002Fdiv><\u002Fdiv>\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.05em;color:#0f766e;background:#ccfbf1;padding:5px 11px;border-radius:999px\">{{ d.tag }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:8px 26px 18px\">\n              <sc-for list=\"{{ d.fields }}\" as=\"f\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid;grid-template-columns:190px 116px 1fr;gap:14px;align-items:start;padding:10px 0;border-bottom:1px solid #f2f5f6\">\n                  <code style=\"font-size:13.5px;font-weight:600;color:#0f1f24;word-break:break-word\">{{ f.f }}<span style=\"{{ f.reqStyle }}\">{{ f.reqMark }}<\u002Fspan><\u002Fcode>\n                  <div><span style=\"{{ f.chip }}\">{{ f.t }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:13px;color:#5b6b72;line-height:1.5\">{{ f.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- REUSABLE OBJECTS -->\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\"><div style=\"width:7px;height:7px;border-radius:999px;background:#0d9488\"><\u002Fdiv><h2 style=\"margin:0;font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b72\">Reusable objects<\u002Fh2><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n        <sc-for list=\"{{ objects }}\" as=\"d\" hint-placeholder-count=\"11\">\n          <div style=\"background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(8,40,55,.06);padding:20px 22px\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\"><i data-lucide=\"{{ d.icon }}\" style=\"width:17px;height:17px;color:#0d9488\"><\u002Fi><code style=\"font-family:'Space Grotesk';font-weight:700;font-size:15.5px\">{{ d.name }}<\u002Fcode><\u002Fdiv>\n            <sc-for list=\"{{ d.fields }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid #f4f6f7\">\n                <code style=\"font-size:12.5px;font-weight:600\">{{ f.f }}<span style=\"{{ f.reqStyle }}\">{{ f.reqMark }}<\u002Fspan><\u002Fcode>\n                <div style=\"display:flex;gap:8px;align-items:baseline;flex-wrap:wrap\"><span style=\"{{ f.chip }}\">{{ f.t }}<\u002Fspan><span style=\"font-size:12px;color:#7a8a90\">{{ f.note }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- TOKEN MAP -->\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\"><div style=\"width:7px;height:7px;border-radius:999px;background:#0d9488\"><\u002Fdiv><h2 style=\"margin:0;font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b72\">Theme token map<\u002Fh2><span style=\"font-size:13px;color:#90a0a6\"><code style=\"font-size:12.5px\">siteSettings.theme<\u002Fcode> → CSS variables<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#fff;border-radius:20px;padding:10px 26px;box-shadow:0 1px 3px rgba(8,40,55,.08)\">\n        <div style=\"display:grid;grid-template-columns:170px 200px 1fr;gap:14px;padding:12px 0;border-bottom:2px solid #eef1f3;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#90a0a6\"><div>Theme field<\u002Fdiv><div>CSS variable<\u002Fdiv><div>Used for<\u002Fdiv><\u002Fdiv>\n        <sc-for list=\"{{ tokenMap }}\" as=\"t\" hint-placeholder-count=\"10\">\n          <div style=\"display:grid;grid-template-columns:170px 200px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid #f2f5f6;align-items:center\">\n            <code style=\"font-size:13px;font-weight:600;color:#0d9488\">{{ t.field }}<\u002Fcode>\n            <code style=\"font-size:13px;color:#5b21b6\">{{ t.var }}<\u002Fcode>\n            <div style=\"font-size:13px;color:#5b6b72\">{{ t.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CODE STARTERS -->\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\"><div style=\"width:7px;height:7px;border-radius:999px;background:#0d9488\"><\u002Fdiv><h2 style=\"margin:0;font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b72\">Schema starters<\u002Fh2><span style=\"font-size:13px;color:#90a0a6\">Sanity v3 · defineType<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <sc-for list=\"{{ snippets }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"background:#0d1620;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px -16px rgba(8,40,55,.5)\">\n            <div style=\"display:flex;align-items:center;gap:9px;padding:13px 20px;border-bottom:1px solid #1c2935;background:#0a1118\"><div style=\"display:flex;gap:6px\"><span style=\"width:11px;height:11px;border-radius:999px;background:#ff5f57\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:999px;background:#febc2e\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:999px;background:#28c840\"><\u002Fspan><\u002Fdiv><code style=\"font-size:12.5px;color:#7d93a0;margin-left:6px\">{{ s.file }}<\u002Fcode><\u002Fdiv>\n            <pre style=\"padding:20px 22px;overflow-x:auto;font-size:12.7px;line-height:1.65;color:#cdd9e0\">{{ s.code }}<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- STUDIO NOTES -->\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:20px\"><div style=\"width:7px;height:7px;border-radius:999px;background:#0d9488\"><\u002Fdiv><h2 style=\"margin:0;font-family:'Space Grotesk';font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b72\">Studio &amp; modelling notes<\u002Fh2><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n        <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"6\">\n          <div style=\"background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(8,40,55,.06);display:flex;gap:13px;align-items:flex-start\">\n            <div style=\"width:34px;height:34px;flex:none;border-radius:10px;background:#f0fbfa;display:flex;align-items:center;justify-content:center\"><i data-lucide=\"{{ n.icon }}\" style=\"width:17px;height:17px;color:#0d9488\"><\u002Fi><\u002Fdiv>\n            <div><div style=\"font-weight:700;font-size:14.5px;font-family:'Space Grotesk';margin-bottom:4px\">{{ n.t }}<\u002Fdiv><div style=\"font-size:13.5px;color:#5b6b72;line-height:1.55\">{{ n.d }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1180, &quot;height&quot;: 900 }\n}\">\nclass Component extends DCLogic {\n  T = {\n    'string':['#eef2ff','#4338ca'], 'text':['#f5f3ff','#6d28d9'], 'portable text':['#faf5ff','#7e22ce'],\n    'number':['#fef3c7','#92400e'], 'boolean':['#ffe4e6','#9f1239'], 'image':['#ccfbf1','#0f766e'],\n    'array':['#ede9fe','#5b21b6'], 'object':['#cffafe','#0e7490'], 'reference':['#dcfce7','#166534'],\n    'url':['#dbeafe','#1e40af'], 'slug':['#f1f5f9','#475569'], 'color':['#fce7f3','#9d174e'],\n    'enum':['#ffedd5','#9a3412'], 'datetime':['#dcfce7','#15803d'],\n  };\n  chip(t){ const c=this.T[t]||['#f1f5f9','#475569']; return `display:inline-block;background:${c[0]};color:${c[1]};padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:700;font-family:ui-monospace,monospace`; }\n  dec(fields){ return fields.map(f=>({ f:f.f, t:f.t, note:f.note||'', chip:this.chip(f.t), reqMark:f.req?'REQ':'', reqStyle:'margin-left:7px;font-size:9px;font-weight:800;letter-spacing:.05em;color:#dc2626;vertical-align:middle' })); }\n\n  componentDidMount(){ this.icons(); }\n  componentDidUpdate(){ this.icons(); }\n  icons(n){ n=n||0; if(window.lucide&&window.lucide.createIcons){try{window.lucide.createIcons();}catch(e){}} else if(n<40) setTimeout(()=>this.icons(n+1),120); }\n\n  renderVals(){\n    const legend = Object.keys(this.T).map(t=>({ t, chip:this.chip(t) }));\n\n    const documents = [\n      { name:'siteSettings', icon:'settings', kind:'Document · singleton', desc:'one per business', fields:[\n        {f:'businessName',t:'string',req:true,note:'Brand name — {{businessName}} everywhere.'},\n        {f:'trade',t:'string',req:true,note:'e.g. “Pool Service”.'},\n        {f:'city / state',t:'string',req:true,note:'Two fields. Drive eyebrow + footer copy.'},\n        {f:'phone',t:'string',req:true,note:'Display + tel: link. Used by nav, hero, contact.'},\n        {f:'email',t:'string',note:'Rule.email() validation.'},\n        {f:'address',t:'object',note:'→ address (street, city, state, zip).'},\n        {f:'hours',t:'array',note:'of dayHours objects (or single string).'},\n        {f:'serviceArea',t:'string',note:'e.g. “{{city}} + 25 miles”.'},\n        {f:'rating',t:'number',note:'0–5, one decimal. Shown as stars.'},\n        {f:'reviewCount',t:'number',note:'“· 127 Google reviews”.'},\n        {f:'logo',t:'image',note:'Nav + footer mark.'},\n        {f:'socials',t:'array',note:'of socialLink.'},\n        {f:'theme',t:'object',note:'→ theme. Palette tokens + fonts + layoutVariant.'},\n        {f:'draftMode',t:'boolean',note:'Renders the DraftShield watermark + Purchase CTA.'},\n        {f:'purchaseUrl',t:'url',note:'Target of “Purchase this site”.'},\n      ]},\n      { name:'page', icon:'file-text', kind:'Document', desc:'structured so sections can become their own pages later', fields:[\n        {f:'title',t:'string',req:true,note:'Internal/Studio title.'},\n        {f:'slug',t:'slug',req:true,note:'Route. Singleton “/” for the one-pager.'},\n        {f:'navigation',t:'object',note:'links[] (navLink) + showPhone + cta (ctaButton).'},\n        {f:'sections',t:'array',req:true,note:'Page builder → the 7 section blocks below, reorderable.'},\n        {f:'seo',t:'object',note:'→ seo (metaTitle, metaDescription, ogImage).'},\n      ]},\n      { name:'review', icon:'message-square-quote', kind:'Document', desc:'reusable & filterable testimonials', fields:[\n        {f:'author',t:'string',req:true,note:'Reviewer name.'},\n        {f:'location',t:'string',note:'e.g. “Henderson”.'},\n        {f:'rating',t:'number',req:true,note:'0–5.'},\n        {f:'quote',t:'text',req:true,note:'The testimonial body.'},\n        {f:'avatar',t:'image',note:'Optional; falls back to initials.'},\n        {f:'initials',t:'string',note:'2-char avatar fallback.'},\n        {f:'source',t:'enum',note:\"'google' | 'facebook' | 'manual'.\"},\n        {f:'date',t:'datetime',note:'Sort newest-first.'},\n        {f:'featured',t:'boolean',note:'Eligible for the Bold layout’s featured slot.'},\n      ]},\n    ];\n\n    const blocks = [\n      { name:'heroSection', icon:'panel-top', tag:'all layouts', desc:'name, trade, rating, CTAs, badges, hero image', fields:[\n        {f:'eyebrow',t:'string',note:'e.g. “Pool Service · {{city}}”.'},\n        {f:'headline',t:'string',req:true,note:'Supports a highlighted span.'},\n        {f:'highlight',t:'string',note:'Phrase rendered in --bs-primary.'},\n        {f:'subhead',t:'text',note:'Supporting sentence.'},\n        {f:'image',t:'image',note:'Hero photo / drop-in slot (AI shot).'},\n        {f:'showRating',t:'boolean',note:'Pull rating + count from siteSettings.'},\n        {f:'badges',t:'array',note:'of trustBadge (Licensed, Locally Owned…).'},\n        {f:'primaryCta',t:'object',note:'→ ctaButton.'},\n        {f:'secondaryCta',t:'object',note:'→ ctaButton.'},\n      ]},\n      { name:'servicesSection', icon:'layout-grid', tag:'all layouts', desc:'6 service cards in a responsive grid', fields:[\n        {f:'eyebrow',t:'string',note:'Section kicker.'},\n        {f:'heading',t:'string',req:true,note:'e.g. “Full-service pool care”.'},\n        {f:'intro',t:'text',note:'Optional lead-in.'},\n        {f:'services',t:'array',req:true,note:'of serviceCard. 3×2 / 2-col / compact per variant.'},\n      ]},\n      { name:'aboutSection', icon:'book-open', tag:'all layouts', desc:'story copy + stats + supporting image', fields:[\n        {f:'eyebrow',t:'string',note:'“Our story”.'},\n        {f:'heading',t:'string',req:true,note:'Section headline.'},\n        {f:'body',t:'portable text',note:'Rich story copy.'},\n        {f:'image',t:'image',note:'Team / van photo.'},\n        {f:'stats',t:'array',note:'of statItem (years, pools serviced).'},\n nk'|'purchase'\"}, {f:'href',t:'url',note:'when action=link'}, {f:'style',t:'enum',note:\"'primary'|'secondary'\"},\n      ]},\n      { name:'serviceCard', icon:'wrench', fields:[\n        {f:'icon',t:'string',note:'lucide name'}, {f:'title',t:'string',req:true}, {f:'description',t:'text'}, {f:'link',t:'url',note:'optional'},\n      ]},\n      { name:'processStep', icon:'list-ordered', fields:[\n        {f:'icon',t:'string',note:'lucide name'}, {f:'title',t:'string',req:true}, {f:'description',t:'text'},\n      ]},\n      { name:'trustBadge', icon:'shield-check', fields:[\n        {f:'icon',t:'string',note:'lucide name'}, {f:'label',t:'string',req:true},\n      ]},\n      { name:'statItem', icon:'hash', fields:[\n        {f:'value',t:'string',req:true,note:'e.g. “3,400+”'}, {f:'label',t:'string',req:true},\n      ]},\n      { name:'navLink', icon:'link', fields:[\n        {f:'label',t:'string',req:true}, {f:'anchor',t:'string',note:'e.g. “#services”'},\n      ]},\n      { name:'footerColumn', icon:'columns-3', fields:[\n        {f:'title',t:'string',req:true}, {f:'links',t:'array',note:'of { label, href }'},\n      ]},\n      { name:'socialLink', icon:'share-2', fields:[\n        {f:'platform',t:'enum',note:\"'facebook'|'instagram'|'google'|'x'\"}, {f:'url',t:'url',req:true},\n      ]},\n      { name:'address', icon:'map-pin', fields:[\n        {f:'street',t:'string'}, {f:'city / state',t:'string'}, {f:'zip',t:'string'},\n      ]},\n      { name:'seo', icon:'search', fields:[\n        {f:'metaTitle',t:'string'}, {f:'metaDescription',t:'text'}, {f:'ogImage',t:'image'},\n      ]},\n      { name:'theme', icon:'palette', fields:[\n        {f:'layoutVariant',t:'enum',req:true,note:\"'split'|'bold'|'trust'\"}, {f:'preset',t:'string',note:'named palette'}, {f:'8 color tokens',t:'color',note:'see token map'}, {f:'fontHeading/Body',t:'string'},\n      ]},\n    ];\n\n    const tokenMap = [\n      {field:'theme.primary',var:'--bs-primary',use:'Buttons, links, icons, key accent e: 'heroSection',\n  title: 'Hero',\n  type: 'object',\n  fields: [\n    defineField({ name: 'eyebrow', type: 'string' }),\n    defineField({ name: 'headline', type: 'string', validation: r => r.required() }),\n    defineField({ name: 'highlight', type: 'string', description: 'Rendered in the primary color' }),\n    defineField({ name: 'subhead', type: 'text', rows: 3 }),\n    defineField({ name: 'image', type: 'image', options: { hotspot: true } }),\n    defineField({ name: 'showRating', type: 'boolean', initialValue: true }),\n    defineField({ name: 'badges', type: 'array', of: [{ type: 'trustBadge' }] }),\n    defineField({ name: 'primaryCta', type: 'ctaButton' }),\n    defineField({ name: 'secondaryCta', type: 'ctaButton' }),\n  ],\n  preview: { select: { title: 'headline' }, prepare: ({ title }) => ({ title, subtitle: 'Hero' }) },\n})` },\n      { file:'schemas/objects/serviceCard.ts', code:\n`import { defineType, defineField } from 'sanity'\n\nexport const serviceCard = defineType({\n  name: 'serviceCard',\n  title: 'Service',\n  type: 'object',\n  fields: [\n    defineField({ name: 'icon', type: 'string', description: 'lucide icon name, e.g. \"waves\"' }),\n    defineField({ name: 'title', type: 'string', validation: r => r.required() }),\n    defineField({ name: 'description', type: 'text', rows: 3 }),\n    defineField({ name: 'link', type: 'url' }),\n  ],\n})` },\n      { file:'schemas/objects/theme.ts', code:\n`import { defineType, defineField } from 'sanity'\n\n// requires @sanity/color-input (the \"color\" type)\nexport const theme = defineType({\n  name: 'theme',\n  title: 'Theme',\n  type: 'object',\n  options: { columns: 2 },\n  fields: [\n    defineField({\n      name: 'layoutVariant',\n      type: 'string',\n      initialValue: 'split',\n      options: { list: ['split', 'bold', 'trust'], layout: 'radio' },\n    }),\n    defineField({ name: 'preset', type: 'string', description: 'e.g. Aqua Slate' }),\n    defineField({ name: 'primary', type: 'color' }),\n    defineField({ name: 'primaryDark', type: 'color' }),\n    defineField({ name: 'accent', type: 'color' }),\n    defineField({ name: 'onPrimary', type: 'color' }),\n    defineField({ name: 'bg', type: 'color' }),\n    defineField({ name: 'surface', type: 'color' }),\n    defineField({ name: 'text', type: 'color' }),\n    defineField({ name: 'muted', type: 'color' }),\n    defineField({ name: 'fontHeading', type: 'string' }),\n    defineField({ name: 'fontBody', type: 'string' }),\n  ],\n})` },\n    ];\n\n    const notes = [\n      { icon:'pin', t:'Singletons', d:'Lock siteSettings and the single page to one document each via the Structure Builder — hide “create new” in the desk.' },\n      { icon:'shuffle', t:'One model, three layouts', d:'A/B/C never change the content. The frontend reads theme.layoutVariant and renders the matching layout; editors swap a radio, not their copy.' },\n      { icon:'recycle', t:'Reviews as documents', d:'Authoring reviews as standalone docs lets you reference them across sections, mark featured, sort by date, and reuse on future pages.' },\n      { icon:'palette', t:'Colors', d:'Use @sanity/color-input for the 8 tokens (or constrain to hex strings with a regex). Seed initialValue from the 12 named presets in the style guide.' },\n      { icon:'shield', t:'Draft state', d:'siteSettings.draftMode → the DraftShield overlay (watermark + Purchase CTA). Flip it off at handoff for the clean live state.' },\n      { icon:'image', t:'Images & icons', d:'image with hotspot for photos; store lucide icon names as strings so they map straight to the frontend’s data-lucide attribute.' },\n    ];\n\n    return {\n      legend,\n      archBlocks: [\n        {n:'heroSection',icon:'panel-top'},{n:'servicesSection',icon:'layout-grid'},{n:'aboutSection',icon:'book-open'},{n:'processSection',icon:'list-ordered'},{n:'reviewsSection',icon:'star'},{n:'contactSection',icon:'mail'},{n:'footerSection',icon:'panel-bottom'},\n      ],\n      archObjects:
